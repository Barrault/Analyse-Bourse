# Configuration complète du CAC40 Analyzer
# Modifiez ces paramètres pour calibrer le système sans toucher au code.
# Toutes les clés sont obligatoires : une clé manquante ou mal orthographiée lève une erreur.

# ============================== INDICATOR PARAMETERS ==============================
indicators:
  # Simple Moving Averages
  sma:
    short_window: 20
    mid_window: 50
    long_window: 200

  # RSI (Relative Strength Index)
  rsi:
    window: 14
    overbought_threshold: 70
    oversold_threshold: 30
    neutral_lower: 50
    neutral_upper: 70

  # MACD (Moving Average Convergence Divergence)
  macd:
    fast_window: 12
    slow_window: 26
    signal_window: 9

  # Bollinger Bands
  bollinger:
    window: 20
    num_std: 2.0

  # ATR (Average True Range)
  atr:
    window: 14

  # Volume SMA
  volume:
    sma_window: 20

# ============================== SCORING WEIGHTS ==============================
scoring:
  # Composantes techniques. Poids à 0 : aucun effet mesuré sur la période d'apprentissage
  # 2017-07 -> 2021-09 (python src/calibrate.py features, règle de DEC-18). Détail : DEC-19.
  # Écart = rang percentile du rendement relatif à 3 mois, condition vraie - fausse.

  # Trend Analysis Weights (appliqués en + si vrai, en - si faux)
  trends:
    long_term: 2.0        # Close > SMA200         écart +4.6  t=3.1
    mid_term: 1.2         # SMA50 > SMA200         écart +4.2  t=2.4
    short_term: 1.0       # SMA20 > SMA50          écart +2.4  t=1.9

  # Momentum Weights (appliqués en + si vrai, en - si faux)
  momentum:
    macd_line: 1.8        # MACD > 0               écart +2.5  t=2.1
    macd_histogram: 0.0   # Histogramme > 0        écart -0.4  t=-0.3  (était 1.5)

  # RSI Weights
  rsi:
    neutral_zone: 0.0     # neutral_lower <= RSI <= neutral_upper   écart +0.4  t=0.4  (était 0.5)
    oversold: 0.0         # RSI < oversold_threshold                écart +0.9  t=0.4  (était 1.0)
    overbought: 0.0       # RSI > overbought_threshold              écart +2.1  t=0.7  (était -1.5, signe contraire)

  # Bollinger Bands Weights
  bollinger:
    above_upper: 0.0      # Price > Upper Band     écart -2.1  t=-1.1 (était 0.8, signe contraire)
    below_lower: 0.0      # Price < Lower Band     écart +4.0  t=1.3  (était -1.5, signe contraire)

  # Volume Weights
  volume:
    high_volume: 0.5      # Volume > SMA20         écart +1.9  t=1.8
    low_volume: -0.5      # Volume <= SMA20

  # Volatility Weights (ATR-based)
  volatility:
    threshold: 0.04       # ATR/Close threshold
    low_volatility: 0.0   # ATR/Close < threshold  écart +3.3  t=0.9  (était 0.8)
    high_volatility: 0.0  # ATR/Close >= threshold (était -0.8)

  # Confiance = probabilité historique qu'un titre batte l'ETF CAC 40 à 3 mois, selon la
  # tranche de score TECHNIQUE (DEC-20). Produit par `python src/calibrate.py calibrate`
  # sur la période d'apprentissage 2017-07 -> 2021-09 (4 538 observations), lissé par
  # régression isotone. Tranches : score < -5.5 | < -0.1 | < 3.5 | < 5.5 | >= 5.5
  confidence_calibration:
    base_rate: 0.470                  # Tous titres confondus
    score_edges: [-5.5, -0.1, 3.5, 5.5]
    probabilities: [0.437, 0.437, 0.482, 0.493, 0.493]
    # Effectifs [450, 1231, 1013, 344, 1500], fréquences brutes [0.438, 0.436, 0.482, 0.500, 0.491]

  # Thresholds for Recommendations
  thresholds:
    buy: 4                 # Score >= this for ACHAT (stricter: fewer false signals)
    sell: -2               # Score <= this for VENTE (stronger signal to exit early)
    # Everything between buy and sell is NEUTRE

# ============================== FUNDAMENTALS ==============================
# Aucun historique gratuit : les fondamentaux ne pèsent pas dans le score (DEC-24).
# Ils sont affichés pour information ; seul ce filtre de prudence agit sur la décision.
fundamentals:
  exclude_loss_making: true   # Pas d'ACHAT si le BPA est négatif (l'ACHAT devient NEUTRE)

# ============================== TRADING PARAMETERS ==============================
trading:
  # Portfolio
  initial_cash: 20000
  # Montant identique pour chaque achat (DEC-21) : la confiance calibrée varie trop peu
  # pour justifier des montants différents.
  order_amount: 1000
  min_order_amount: 100    # Achat réduit accepté si la trésorerie ne permet pas order_amount
  margin_buffer: 200       # Trésorerie toujours conservée

  # Exit rules (en plus du signal VENTE), contrôlées à chaque rebalance
  exit_rules:
    stop_loss_pct: 15   # Vente si la clôture de la veille est >= 15 % sous le prix d'achat (null = désactivé)

  # Rebalancing : 1er jour de cotation de chaque période, ordres au cours d'ouverture
  rebalance:
    frequency: "month"  # Options: "week", "month", "quarter"

# ============================== FEES (Bourse Direct) ==============================
fees:
  structure:
    - max_amount: 500
      fixed_fee: 0.99
    - max_amount: 1000
      fixed_fee: 1.90
    - max_amount: 2000
      fixed_fee: 2.90
    - max_amount: 4400
      fixed_fee: 3.80
    - max_amount: null        # All amounts above 4400
      percentage_fee: 0.0009  # 0.09% of amount

# ============================== BACKTEST PARAMETERS ==============================
backtest:
  # Période de TEST, hors échantillon : aucun réglage n'est choisi sur ces dates (DEC-18).
  # Tronquée automatiquement à la dernière cotation disponible.
  start_date: "2022-01-01"
  end_date: "2026-12-31"

  # Les fondamentaux Yahoo sont ceux d'aujourd'hui : les activer en backtest introduit
  # un biais d'anticipation (une date de 2024 notée avec des résultats de 2026).
  use_fundamentals: false

  # Benchmark d'achat-conservation. ETF Amundi CAC 40 plutôt que l'indice ^FCHI : l'indice
  # est un indice de PRIX (dividendes exclus) alors que la stratégie est valorisée en prix
  # ajustés des dividendes ; comparer les deux avantagerait la stratégie de ~3 %/an.
  benchmark: "CAC.PA"

  # Data Download (journalier, prix ajustés des dividendes et splits)
  data:
    period: "10y"          # Historique téléchargé : couvre l'apprentissage (calibration.*) et le test

# ============================== CALIBRATION ==============================
# Période d'APPRENTISSAGE, utilisée par src/calibrate.py pour choisir les composantes du
# score et calibrer la confiance (DEC-18). Elle précède la période de test (backtest.*).
calibration:
  train_start: "2017-07-01"   # 1re date avec 200 séances d'historique (données dès 2016-09)
  train_end: "2021-09-30"     # Purge : le rendement à 3 mois se termine avant le test (2022)
  horizon_days: 63            # Horizon du rendement mesuré : ~3 mois de séances
  # Règle fixée AVANT d'observer les résultats : une composante garde son poids si son
  # effet sur la période d'apprentissage a le signe attendu et un t >= min_t ; sinon 0.
  min_t: 1.0

# ============================== DATA QUALITY ==============================
data_quality:
  # Une clôture multipliée ou divisée par ce facteur en une séance est traitée comme une
  # opération sur titre mal ajustée : seul l'historique postérieur est conservé (DEC-17).
  max_daily_factor: 2.0
  # Mouvements de ce type vérifiés comme RÉELS (à ne pas filtrer) :
  verified_real_moves:
    - "ETL.PA"   # Eutelsat : +120 % le 2025-03-05 (spéculation sur la défense européenne)
    - "WLN.PA"   # Worldline : -59 % le 2023-10-25 (avertissement sur résultats)

# ============================== OUTPUT ==============================
output:
  results_dir: "results"                    # Relatif à la racine du projet
  results_filename: "backtest_results.json"

# ============================== CALIBRATION HINTS ==============================
# 1. SEUILS : baisser scoring.thresholds.buy (ex: 3) donne plus de signaux ACHAT ;
#    baisser scoring.thresholds.sell (ex: -4) donne moins de signaux VENTE.
# 2. POIDS TECHNIQUES : ne réactiver une règle à 0 que si `python src/calibrate.py
#    features` montre un effet sur la période d'APPRENTISSAGE (jamais sur le test).
# 3. CONFIANCE : après tout changement de poids, relancer `calibrate` puis `evaluate`
#    et reporter la nouvelle table dans scoring.confidence_calibration.
# 4. TAILLE DES ORDRES : order_amount par achat ; avec un capital de 20 000 € et
#    1 000 € par ordre, il faut ~20 positions pour être investi.
# 5. Toujours comparer au benchmark (backtest.benchmark) avant de conclure.
