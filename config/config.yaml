# Configuration complète du CAC40 Analyzer
# Modifiez ces paramètres pour calibrer le système sans toucher au code

# ============================== INDICATOR PARAMETERS ==============================
indicators:
  # Simple Moving Averages
  sma:
    short_window: 20
    mid_window: 50
    long_window: 200

  # RSI (Relative Strength Index)
  rsi:
    window: 14
    overbought_threshold: 70
    oversold_threshold: 30
    neutral_lower: 50
    neutral_upper: 70

  # MACD (Moving Average Convergence Divergence)
  macd:
    fast_window: 12
    slow_window: 26
    signal_window: 9

  # Bollinger Bands
  bollinger:
    window: 20
    num_std: 2.0

  # ATR (Average True Range)
  atr:
    window: 14

  # Volume SMA
  volume:
    sma_window: 20

# ============================== SCORING WEIGHTS ==============================
scoring:
  # Trend Analysis Weights
  trends:
    long_term: 2.0        # Close > SMA200
    mid_term: 1.2         # SMA50 > SMA200
    short_term: 1.0       # SMA20 > SMA50

  # Momentum Weights
  momentum:
    macd_line: 1.8        # MACD > 0
    macd_histogram: 1.5   # MACD Histogram > 0

  # RSI Weights
  rsi:
    neutral_zone: 0.5     # RSI between 50-70
    oversold: 1.0         # RSI < 30
    overbought: -1.5      # RSI > 70

  # Bollinger Bands Weights
  bollinger:
    above_upper: 0.8      # Price > Upper Band
    below_lower: -1.5     # Price < Lower Band

  # Volume Weights
  volume:
    high_volume: 0.5      # Volume > SMA20
    low_volume: -0.5      # Volume < SMA20

  # Volatility Weights (ATR-based)
  volatility:
    threshold: 0.04       # ATR/Close threshold
    low_volatility: 0.8   # ATR/Close < threshold
    high_volatility: -0.8 # ATR/Close >= threshold

  # Fundamental Analysis Weights
  fundamentals:
    # PE Ratio Analysis (une seule contribution au score)
    pe:
      negative: -2.0      # Entreprise en perte (BPA < 0) - aussi marquée "toxique"
      very_low: -0.5      # PE < pe_very_low (piège de valeur possible)
      low: 0.8            # PE <= pe_low_max, avec tendance haussière
      low_weak: -0.5      # PE <= pe_low_max, tendance faible
      moderate: -0.5      # PE <= pe_moderate_max
      high: -2.0          # PE > pe_moderate_max

    # Price-to-Book Analysis (qualifié par le ROE implicite = P/B / PE)
    pb:
      very_low_good_roe: 0.5    # P/B < pb_low avec ROE > roe_min
      very_low_bad_roe: -1.0    # P/B < pb_low avec ROE faible
      moderate_good_roe: 0.5    # P/B <= pb_moderate_max avec ROE >= roe_good
      moderate_bad_roe: -0.5    # P/B <= pb_moderate_max avec ROE faible
      high: -1.5                # P/B > pb_moderate_max (cher, mais pas "toxique")

    # Cross PE/PB Sanity Checks
    expensive_both: -2.0   # PE > expensive_pe ET P/B > expensive_pb
    cheap_with_growth: 1.5 # PE < cheap_pe ET P/B < cheap_pb ET cours > SMA200

    # Dividend Yield (entre medium et high : neutre, pas de points)
    dividend:
      high_yield: 1.0      # DY >= high_yield_pct
      no_dividend: -0.5    # Aucun dividende versé sur 12 mois

    # Seuils des tranches ci-dessus
    limits:
      pe_very_low: 8
      pe_low_max: 14
      pe_moderate_max: 22
      pb_low: 1.0
      pb_moderate_max: 2.5
      roe_min: 10          # % - ROE implicite minimal pour un P/B < pb_low
      roe_good: 12         # % - ROE implicite pour un P/B normal
      expensive_pe: 20
      expensive_pb: 3
      cheap_pe: 12
      cheap_pb: 1.2
      high_yield_pct: 5
      medium_yield_pct: 2
      value_support_pe: 11   # VENTE bridée si PE < ... et P/B < ... (titre déjà bradé)
      value_support_pb: 1.1

  # Confiance d'un signal : 0.5 au seuil, 1.0 à `confidence_scale` points au-delà.
  # 8 points = écart entre le seuil d'achat (4) et un score quasi maximal (~12).
  confidence_scale: 8

  # Thresholds for Recommendations
  thresholds:
    buy: 4                 # Score >= this for ACHAT (stricter: fewer false signals)
    sell: -2               # Score <= this for VENTE (stronger signal to exit early)
    # Everything between buy and sell is NEUTRE

# ============================== TRADING PARAMETERS ==============================
trading:
  # Portfolio
  initial_cash: 20000
  min_order_amount: 100    # Montant d'un achat à faible confiance
  max_order_amount: 1000   # Montant d'un achat à confiance maximale

  # Order Sizing Strategy : montant linéaire en fonction de la confiance
  order_sizing:
    min_confidence_for_min_spend: 0.2  # Confiance <= ceci -> min_order_amount
    max_confidence_for_max_spend: 1.0  # Confiance >= ceci -> max_order_amount
    margin_buffer: 200                 # Trésorerie toujours conservée

  # Rebalancing
  rebalance:
    frequency: "month"  # Options: "month", "week", "quarter"
    day_of_month: 1     # 1st day of month, adjusted to first trading day

# ============================== FEES (Bourse Direct) ==============================
fees:
  structure:
    - max_amount: 500
      fixed_fee: 0.99
    - max_amount: 1000
      fixed_fee: 1.90
    - max_amount: 2000
      fixed_fee: 2.90
    - max_amount: 4400
      fixed_fee: 3.80
    - max_amount: null        # All amounts above 4400
      percentage_fee: 0.0009  # 0.09% of amount

# ============================== BACKTEST PARAMETERS ==============================
backtest:
  # Date Range
  start_date: "2024-01-01"
  end_date: "2026-12-31"

  # Data Download
  data:
    period: "5y"           # Historical period to download
    interval: "1d"         # Daily data
    auto_adjust: true      # Automatically adjust OHLC

# ============================== OUTPUT & LOGGING ==============================
output:
  verbose: true
  debug_tickers: ["AC.PA"]  # Print debug info for these tickers
  save_results: true
  results_dir: "results"
  results_filename: "backtest_results.json"

# ============================== CALIBRATION HINTS ==============================
# Use these notes when tweaking parameters:
#
# 1. SCORING: Increase weights if you want more aggressive signals
#    - Decrease 'buy' threshold (e.g., 3 instead of 5) for more BUY signals
#    - Increase 'sell' threshold (e.g., -5) for fewer SELL signals
#
# 2. FUNDAMENTALS: PE and P/B heavily influence quality
#    - Higher PE penalties = fewer overvalued stocks
#    - Higher P/B penalties = prefer asset-light businesses
#
# 3. TRENDS vs MOMENTUM: Balance trend-following vs mean-reversion
#    - Increase trend weights for systematic buying on strength
#    - Increase RSI/overbought penalties for contrarian signals
#
# 4. ORDER SIZING: Larger orders pay lower fees but higher risk
#    - Typical: 0.25 = 25% per order, allows ~4 concurrent positions
#    - Conservative: 0.15 = 15%, allows ~6 positions
#    - Aggressive: 0.50 = 50%, allows ~2 positions max
